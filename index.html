
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> To-Do List </title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #e0bac5, #c9daec);
            min-height: 100vh;
            padding: 30px;
            color: #978282;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        header h1 {
            color: #e59fb8;
            font-size: 38px;
        }

        header p {
            margin-top: 10px;
            color: #a2b7d5;
        }

        .main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(150, 150, 180, 0.12);
        }

        h2 {
            color: #8c9fbd;
            margin-bottom: 20px;
        }

        /* Calendar */

        .calendar {
            background: #e5f5df;
            border-radius: 20px;
            padding: 20px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: #b0d3b2;
        }

        .calendar-header button {
            background: #cce2c5;
            border: none;
            border-radius: 10px;
            padding: 8px 12px;
            cursor: pointer;
            color: #a0c1a3;
        }

        .days, .dates {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            gap: 8px;
        }

        .days {
            font-size: 13px;
            color: #7d9c7b;
            margin-bottom: 12px;
        }

        .dates span {
            padding: 10px 0;
            border-radius: 10px;
            cursor: pointer;
        }

        .dates span:hover {
            background: #cdeac5;
        }

        .dates .today {
            background: #b7dcb0;
            font-weight: bold;
        }

        .dates .selected {
            background: #94c88b;
            color: white;
        }

        .dates .empty {
            cursor: default;
        }

        /* Tasks */

        .task-input {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 2px solid #f5d9e5;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
            background: #fffafd;
        }

        input:focus {
            border-color: #c5d9f5;
        }

        .add-btn {
            background: #f3b8d0;
            border: none;
            padding: 12px 18px;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            font-size: 20px;
        }

        .add-btn:hover {
            background: #e99fbd;
        }

        #taskDate {
            margin-bottom: 15px;
            border-color: #d4e7fa;
        }

        ul {
            list-style: none;
        }

        li {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #fdf0f5;
            padding: 14px;
            border-radius: 13px;
            margin-bottom: 12px;
            overflow-wrap: anywhere;
        }

        li.completed span {
            text-decoration: line-through;
            color: #aaa;
        }

        li span {
            flex: 1;
        }

        li input[type="checkbox"] {
            width: auto;
            accent-color: #fdaccf;
            cursor: pointer;
        }

        .delete-btn {
            border: none;
            background: #d9e9fb;
            color: #859cb8;
            padding: 7px 10px;
            border-radius: 8px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #c2dcf8;
        }

        .empty-message {
            text-align: center;
            color: #aaa;
            padding: 20px;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            color: #cd9bc4;
        }

        @media (max-width: 700px) {
            .main {
                grid-template-columns: 1fr;
            }

            body {
                padding: 15px;
            }

            header h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>♡ My Little Planner ♡</h1>
        <p>Make today beautiful, one task at a time ✨</p>
    </header>

    <div class="main">

        <!-- Calendar Section -->
        <div class="card">
            <h2>🌿 My Calendar</h2>

            <div class="calendar">

                <div class="calendar-header">
                    <button onclick="changeMonth(-1)">❮</button>
                    <h3 id="monthYear"></h3>
                    <button onclick="changeMonth(1)">❯</button>
                </div>

                <div class="days">
                    <div>Sun</div>
                    <div>Mon</div>
                    <div>Tue</div>
                    <div>Wed</div>
                    <div>Thu</div>
                    <div>Fri</div>
                    <div>Sat</div>
                </div>

                <div class="dates" id="calendarDates"></div>

            </div>

            <p style="margin-top: 15px; color: #789879;">
                Selected date: <span id="selectedDate"></span>
            </p>
        </div>

        <!-- To-Do Section -->
        <div class="card">
            <h2>🎀 My To-Do List</h2>

            <input type="date" id="taskDate">

            <div class="task-input">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Write your task here..."
                >

                <button class="add-btn" onclick="addTask()">+</button>
            </div>

            <ul id="taskList"></ul>

            <p id="emptyMessage" class="empty-message">
                No tasks yet. Add something lovely! 🌸
            </p>
        </div>

    </div>

    <footer>
        Made with ♡ and a little bit of magic
    </footer>

</div>

<script>
    const calendarDates = document.getElementById("calendarDates");
    const monthYear = document.getElementById("monthYear");
    const selectedDateText = document.getElementById("selectedDate");
    const taskDate = document.getElementById("taskDate");

    let currentDate = new Date();
    let selectedDate = new Date();

    function formatDate(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");

        return `${year}-${month}-${day}`;
    }

    function updateSelectedDate() {
        selectedDateText.textContent = selectedDate.toLocaleDateString(
            "en-US",
            {
                day: "numeric",
                month: "long",
                year: "numeric"
            }
        );

        taskDate.value = formatDate(selectedDate);
        renderCalendar();
        renderTasks();
    }

    function renderCalendar() {
        calendarDates.innerHTML = "";

        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        monthYear.textContent = currentDate.toLocaleDateString(
            "en-US",
            {
                month: "long",
                year: "numeric"
            }
        );

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < firstDay; i++) {
            const empty = document.createElement("span");
            empty.className = "empty";
            calendarDates.appendChild(empty);
        }

        for (let day = 1; day <= daysInMonth; day++) {
            const date = new Date(year, month, day);
            const dateElement = document.createElement("span");

            dateElement.textContent = day;

            if (formatDate(date) === formatDate(new Date())) {
                dateElement.classList.add("today");
            }

            if (formatDate(date) === formatDate(selectedDate)) {
                dateElement.classList.add("selected");
            }

            dateElement.onclick = function () {
                selectedDate = date;
                updateSelectedDate();
            };

            calendarDates.appendChild(dateElement);
        }
    }

    function changeMonth(direction) {
        currentDate.setMonth(currentDate.getMonth() + direction);
        renderCalendar();
    }

    taskDate.addEventListener("change", function () {
        if (!taskDate.value) return;

        selectedDate = new Date(taskDate.value + "T12:00:00");
        currentDate = new Date(
            selectedDate.getFullYear(),
            selectedDate.getMonth(),
            1
        );

        updateSelectedDate();
    });

    function addTask() {
        const input = document.getElementById("taskInput");
        const task = input.value.trim();

        if (task === "") {
            alert("Please enter a task! 🌸");
            return;
        }

        const tasks = JSON.parse(
            localStorage.getItem("myTasks") || "[]"
        );

        tasks.push({
            text: task,
            date: taskDate.value,
            completed: false
        });

        localStorage.setItem("myTasks", JSON.stringify(tasks));

        input.value = "";
        renderTasks();
    }

    function renderTasks() {
        const taskList = document.getElementById("taskList");
        const emptyMessage = document.getElementById("emptyMessage");

        taskList.innerHTML = "";

        const tasks = JSON.parse(
            localStorage.getItem("myTasks") || "[]"
        );

        const filteredTasks = tasks.filter(
            task => task.date === taskDate.value
        );

        emptyMessage.style.display =
            filteredTasks.length === 0 ? "block" : "none";

        filteredTasks.forEach(task => {
            const li = document.createElement("li");

            if (task.completed) {
                li.classList.add("completed");
            }

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.checked = task.completed;

            checkbox.onchange = function () {
                task.completed = checkbox.checked;

                localStorage.setItem(
                    "myTasks",
                    JSON.stringify(tasks)
                );

                renderTasks();
            };

            const span = document.createElement("span");
            span.textContent = task.text;

            const deleteButton = document.createElement("button");
            deleteButton.textContent = "✕";
            deleteButton.className = "delete-btn";

            deleteButton.onclick = function () {
                const index = tasks.indexOf(task);
                tasks.splice(index, 1);

                localStorage.setItem(
                    "myTasks",
                    JSON.stringify(tasks)
                );

                renderTasks();
            };

            li.appendChild(checkbox);
            li.appendChild(span);
            li.appendChild(deleteButton);

            taskList.appendChild(li);
        });
    }

    document.getElementById("taskInput").addEventListener(
        "keydown",
        function (event) {
            if (event.key === "Enter") {
                addTask();
            }
        }
    );
    updateSelectedDate();
</script>
</body>
</html>
